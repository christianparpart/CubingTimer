<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover">
    <meta name="color-scheme" content="light">
    <title>CubingTimer</title>
    <style>
      html, body {
        padding: 0;
        margin: 0;
        height: 100vh;
        width: 100vw;
        background: #fff;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        color: #222;
        overflow: hidden;
      }
      /* Qt for WASM 6.7+ wants a <div> as the container — passing a <canvas>
         triggers a runtime warning and an implicit conversion. */
      #qt-container {
        display: block;
        width: 100vw;
        height: 100vh;
        background: #fafafa;
        position: relative;
      }
      #loader, #error {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1rem;
        padding: 2rem;
        text-align: center;
        background: #fff;
      }
      #error {
        display: none;
        color: #b00020;
      }
      #error pre {
        max-width: 90vw;
        max-height: 50vh;
        overflow: auto;
        padding: 1rem;
        background: #f5f5f5;
        color: #222;
        text-align: left;
        font-size: 12px;
        white-space: pre-wrap;
        word-wrap: break-word;
      }
      .spinner {
        width: 48px;
        height: 48px;
        border: 4px solid #e0e0e0;
        border-top-color: #3949ab;
        border-radius: 50%;
        animation: spin 1s linear infinite;
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
      h1 { font-size: 1.25rem; margin: 0; }
      p { margin: 0; opacity: 0.7; }
    </style>
  </head>
  <body>
    <div id="qt-container" tabindex="-1"></div>

    <div id="loader">
      <div class="spinner" aria-hidden="true"></div>
      <h1>CubingTimer</h1>
      <p id="loader-status">Loading…</p>
    </div>

    <div id="error">
      <h1>Could not start CubingTimer</h1>
      <p id="error-summary">Something went wrong while loading the WebAssembly bundle.</p>
      <pre id="error-detail"></pre>
      <p>If this happens on a mobile browser, try a desktop browser (Chrome or Firefox) — the renderer needs WebGL2, which not every device supports.</p>
    </div>

    <script type="text/javascript">
      function showError(summary, detail) {
        document.getElementById('loader').style.display = 'none';
        const err = document.getElementById('error');
        err.style.display = 'flex';
        document.getElementById('error-summary').textContent = summary;
        const d = document.getElementById('error-detail');
        if (detail) {
            d.textContent = typeof detail === 'string' ? detail : (detail.stack || String(detail));
        } else {
            d.style.display = 'none';
        }
      }

      function setStatus(text) {
        const el = document.getElementById('loader-status');
        if (el) el.textContent = text;
      }

      // WebGL2 is required by Qt 6.7's Quick renderer. If it's missing,
      // show a clear message rather than letting Qt fail silently. We only
      // warn here — Qt itself might still succeed via fallback paths.
      function checkWebGL2() {
        try {
          const probe = document.createElement('canvas');
          if (!probe.getContext('webgl2')) {
            showError('This browser does not expose WebGL2.',
                      'CubingTimer needs WebGL2 to render. Try a newer Chrome / Firefox, ' +
                      'or enable hardware acceleration in your browser settings.');
            return false;
          }
        } catch (e) {
          console.error('webgl2 probe failed:', e);
        }
        return true;
      }

      async function init() {
        if (!checkWebGL2()) return;
        const container = document.getElementById('qt-container');
        try {
          setStatus('Downloading…');
          await qtLoad({
            qt: {
              onLoaded: () => {
                document.getElementById('loader').style.display = 'none';
                container.focus();
              },
              onExit: exitData => {
                showError(
                  'CubingTimer exited' +
                    (exitData.code !== undefined ? ` (code ${exitData.code})` : ''),
                  exitData.text);
              },
              entryFunction: window.CubingTimerApp_entry,
              containerElements: [container],
            },
            // Surface emscripten print/error to a visible error pane so phone
            // users aren't stuck on a blank screen with no clue.
            print: text => console.log(text),
            printErr: text => {
              console.error(text);
              setStatus(text);
            },
            locateFile: path => path,
          });
        } catch (e) {
          console.error(e);
          showError('Failed to start the WebAssembly bundle.', e);
        }
      }

      // qtloader.js defines qtLoad; CubingTimerApp.js defines the entry. Both
      // need to be loaded before init().
      window.addEventListener('load', init);
    </script>
    <script src="CubingTimerApp.js"></script>
    <script src="qtloader.js"></script>
  </body>
</html>
