name: build

on:
  push:
    branches: [main]
    paths-ignore: ['**/*.md', 'LICENSE']
  pull_request:
    branches: [main]
    paths-ignore: ['**/*.md', 'LICENSE']
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  QT_VERSION: 6.8.1

jobs:
  # -------------------------------------------------------------------------
  # Native builds (Linux / macOS / Windows): configure, build, run tests.
  # -------------------------------------------------------------------------
  native:
    name: native (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            preset: default
            install_aqt_modules: 'qtcharts'
          - os: macos-latest
            preset: default
            install_aqt_modules: 'qtcharts'
          - os: windows-latest
            preset: default
            install_aqt_modules: 'qtcharts'
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgl1-mesa-dev libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xkb1 libpulse0

      - name: Install Ninja (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja

      - name: Install Ninja (Windows)
        if: runner.os == 'Windows'
        run: choco install ninja -y

      - name: Set up MSVC environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          modules: ${{ matrix.install_aqt_modules }}
          cache: true

      - uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ matrix.os }}-native

      - name: Configure
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        run: cmake --build build/default --parallel

      - name: Test
        run: ctest --test-dir build/default --output-on-failure

  # -------------------------------------------------------------------------
  # WebAssembly: cross-compile only (no test run).
  # -------------------------------------------------------------------------
  wasm:
    name: wasm (emscripten)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Ninja
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build

      # Qt for WebAssembly is pinned to a specific emsdk version per Qt
      # release. For Qt 6.8.x, that's emsdk 3.1.56. Mismatched emsdk silently
      # breaks linking.
      - name: Install emsdk 3.1.56
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 3.1.56
          actions-cache-folder: emsdk-cache

      - name: Install host Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          modules: 'qtcharts'
          cache: true
          set-env: false
          dir: ${{ github.workspace }}/qt-host

      - name: Install Qt for WebAssembly
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          target: 'desktop'
          arch: 'wasm_singlethread'
          modules: 'qtcharts'
          cache: true
          set-env: false
          dir: ${{ github.workspace }}/qt-wasm

      - uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: wasm

      - name: Configure
        env:
          QT_HOST_PATH: ${{ github.workspace }}/qt-host/Qt/${{ env.QT_VERSION }}/gcc_64
        run: |
          cmake -S . -B build/wasm -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE=${{ github.workspace }}/qt-wasm/Qt/${{ env.QT_VERSION }}/wasm_singlethread/lib/cmake/Qt6/qt.toolchain.cmake \
            -DQT_HOST_PATH=${{ github.workspace }}/qt-host/Qt/${{ env.QT_VERSION }}/gcc_64 \
            -DCMAKE_BUILD_TYPE=Release \
            -DCUBINGTIMER_TESTING=OFF

      - name: Build
        run: cmake --build build/wasm --parallel

      - name: Upload wasm artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cubingtimer-wasm
          path: |
            build/wasm/src/CubingTimer/CubingTimerApp.html
            build/wasm/src/CubingTimer/CubingTimerApp.js
            build/wasm/src/CubingTimer/CubingTimerApp.wasm
            build/wasm/src/CubingTimer/qtloader.js
          if-no-files-found: warn

  # -------------------------------------------------------------------------
  # Android APK: cross-compile, no tests on device.
  # -------------------------------------------------------------------------
  android:
    name: android (arm64-v8a)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Ninja
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install host Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          modules: 'qtcharts'
          cache: true
          set-env: false
          dir: ${{ github.workspace }}/qt-host

      - name: Install Qt for Android (arm64-v8a)
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          target: 'android'
          arch: 'android_arm64_v8a'
          modules: 'qtcharts'
          cache: true
          set-env: false
          dir: ${{ github.workspace }}/qt-android

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK
        run: |
          sdkmanager --install "ndk;26.1.10909125" "platforms;android-34" "build-tools;34.0.0"
          echo "ANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk/26.1.10909125" >> $GITHUB_ENV

      - name: Configure
        run: |
          cmake -S . -B build/android -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE=${{ github.workspace }}/qt-android/Qt/${{ env.QT_VERSION }}/android_arm64_v8a/lib/cmake/Qt6/qt.toolchain.cmake \
            -DQT_HOST_PATH=${{ github.workspace }}/qt-host/Qt/${{ env.QT_VERSION }}/gcc_64 \
            -DANDROID_SDK_ROOT=$ANDROID_SDK_ROOT \
            -DANDROID_NDK_ROOT=$ANDROID_NDK_ROOT \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-26 \
            -DCMAKE_BUILD_TYPE=Release \
            -DCUBINGTIMER_TESTING=OFF

      - name: Build APK
        run: cmake --build build/android --target apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: cubingtimer-android-arm64-v8a
          path: build/android/src/CubingTimer/android-build/build/outputs/apk/**/*.apk
          if-no-files-found: warn
