name: build

on:
  push:
    paths-ignore: ['**/*.md', 'LICENSE']
  pull_request:
    paths-ignore: ['**/*.md', 'LICENSE']
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Qt 6.7.3 is the latest version that publishes a WASM build via aqtinstall.
  # 6.8.x has no WASM binaries yet, so pinning all jobs to the same version
  # keeps the matrix uniform.
  QT_VERSION: "6.7.3"
  # Pin LLVM tools to a version that ships <expected>/<print>/std::ranges
  # algorithms used throughout the codebase.
  CLANG_TOOLS_VERSION: "22"
  # Headless QPA: tests don't need a display.
  QT_QPA_PLATFORM: offscreen
  # CPM cache shared across jobs to avoid re-downloading Catch2 in fallback paths.
  CPM_SOURCE_CACHE: ${{ github.workspace }}/.cache/CPM

jobs:
  # -------------------------------------------------------------------------
  # Code style: clang-format dry-run over all C++ sources.
  # -------------------------------------------------------------------------
  style:
    name: check style (clang-format)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install clang-format ${{ env.CLANG_TOOLS_VERSION }}
        run: |
          wget https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh ${{ env.CLANG_TOOLS_VERSION }}
          sudo apt-get install -y clang-format-${{ env.CLANG_TOOLS_VERSION }}

      - name: Verify formatting
        run: |
          git ls-files 'src/**/*.hpp' 'src/**/*.cpp' \
            | xargs clang-format-${{ env.CLANG_TOOLS_VERSION }} --dry-run --Werror --style=file

  # -------------------------------------------------------------------------
  # Static analysis: clang-tidy with the project's full rule set. Mandatory.
  # Uses Clang ${CLANG_TOOLS_VERSION} from the upstream LLVM apt repo so
  # libc++ has <expected> and the parser groks C++23.
  # -------------------------------------------------------------------------
  tidy:
    name: check clang-tidy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Cache CPM packages
        uses: actions/cache@v4
        with:
          path: ${{ env.CPM_SOURCE_CACHE }}
          key: cpm-tidy-${{ hashFiles('CMakeLists.txt') }}
          restore-keys: cpm-tidy-

      - uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: tidy
          max-size: 256M

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build catch2 libgl1-mesa-dev libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xkb1 libpulse0

      - name: Install Clang ${{ env.CLANG_TOOLS_VERSION }} + clang-tidy
        run: |
          wget https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh ${{ env.CLANG_TOOLS_VERSION }}
          sudo apt-get install -y clang-${{ env.CLANG_TOOLS_VERSION }} clang-tidy-${{ env.CLANG_TOOLS_VERSION }} libc++-${{ env.CLANG_TOOLS_VERSION }}-dev libc++abi-${{ env.CLANG_TOOLS_VERSION }}-dev
          sudo ln -sf /usr/bin/clang-${{ env.CLANG_TOOLS_VERSION }} /usr/local/bin/clang
          sudo ln -sf /usr/bin/clang++-${{ env.CLANG_TOOLS_VERSION }} /usr/local/bin/clang++
          sudo ln -sf /usr/bin/clang-tidy-${{ env.CLANG_TOOLS_VERSION }} /usr/local/bin/clang-tidy

      - uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          modules: 'qtgraphs qtquick3d qtshadertools'
          cache: true

      - name: Configure
        env:
          CC: clang
          CXX: clang++
        run: cmake --preset default

      - name: Build with clang-tidy
        run: cmake --build build/default --parallel

  # -------------------------------------------------------------------------
  # Native builds (Linux / macOS / Windows): configure, build, run tests.
  # -------------------------------------------------------------------------
  native:
    name: native (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
          - os: macos-latest
          - os: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache CPM packages
        uses: actions/cache@v4
        with:
          path: ${{ env.CPM_SOURCE_CACHE }}
          key: cpm-${{ matrix.os }}-${{ hashFiles('CMakeLists.txt') }}
          restore-keys: cpm-${{ matrix.os }}-

      - name: Install Linux system packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build catch2 libgl1-mesa-dev libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xkb1 libpulse0

      - name: Install Clang ${{ env.CLANG_TOOLS_VERSION }} (Linux)
        if: runner.os == 'Linux'
        run: |
          wget https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh ${{ env.CLANG_TOOLS_VERSION }}
          sudo apt-get install -y clang-${{ env.CLANG_TOOLS_VERSION }} libc++-${{ env.CLANG_TOOLS_VERSION }}-dev libc++abi-${{ env.CLANG_TOOLS_VERSION }}-dev
          sudo ln -sf /usr/bin/clang-${{ env.CLANG_TOOLS_VERSION }} /usr/local/bin/clang
          sudo ln -sf /usr/bin/clang++-${{ env.CLANG_TOOLS_VERSION }} /usr/local/bin/clang++

      - name: Install macOS packages
        if: runner.os == 'macOS'
        run: brew install ninja catch2

      - name: Install Ninja (Windows)
        if: runner.os == 'Windows'
        run: choco install ninja -y

      - name: Set up MSVC environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          modules: 'qtgraphs qtquick3d qtshadertools'
          cache: true

      - uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ matrix.os }}-native
          max-size: 256M

      - name: Configure
        env:
          CC: ${{ runner.os == 'Linux' && 'clang' || '' }}
          CXX: ${{ runner.os == 'Linux' && 'clang++' || '' }}
        # `ci` preset = Debug + tests + asan/ubsan; clang-tidy off (the
        # dedicated `tidy` job covers that).
        run: cmake --preset ci

      - name: Build
        run: cmake --build build/default --parallel

      - name: Test
        env:
          # Allow the intentional leak of QCoreApplication in the test fixture
          # (it outlives Catch2's main on purpose, avoiding a Qt teardown race).
          LSAN_OPTIONS: detect_leaks=0
        run: ctest --test-dir build/default --output-on-failure

  # -------------------------------------------------------------------------
  # WebAssembly: cross-compile only (no test run).
  # -------------------------------------------------------------------------
  wasm:
    name: wasm (emscripten)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Cache CPM packages
        uses: actions/cache@v4
        with:
          path: ${{ env.CPM_SOURCE_CACHE }}
          key: cpm-wasm-${{ hashFiles('CMakeLists.txt') }}
          restore-keys: cpm-wasm-

      - name: Install Ninja
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build

      # Qt for WebAssembly pins an exact emsdk version per Qt release.
      # Qt 6.7.x is built against emsdk 3.1.50. Mismatched emsdk breaks linking.
      - name: Install emsdk 3.1.50
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 3.1.50
          actions-cache-folder: emsdk-cache

      - name: Install host Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          modules: 'qtgraphs qtquick3d qtshadertools'
          cache: true
          set-env: false
          dir: ${{ github.workspace }}/qt-host

      - name: Install Qt for WebAssembly
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          # Qt 6.7+ ships WASM under all_os/wasm/ — `host: all_os` is required.
          host: 'all_os'
          target: 'wasm'
          arch: 'wasm_singlethread'
          modules: 'qtgraphs qtquick3d qtshadertools'
          cache: true
          set-env: false
          dir: ${{ github.workspace }}/qt-wasm

      - uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: wasm
          max-size: 256M

      - name: Configure
        env:
          QT_HOST_PATH: ${{ github.workspace }}/qt-host/Qt/${{ env.QT_VERSION }}/gcc_64
        run: |
          cmake -S . -B build/wasm -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE=${{ github.workspace }}/qt-wasm/Qt/${{ env.QT_VERSION }}/wasm_singlethread/lib/cmake/Qt6/qt.toolchain.cmake \
            -DQT_HOST_PATH=${{ github.workspace }}/qt-host/Qt/${{ env.QT_VERSION }}/gcc_64 \
            -DCMAKE_BUILD_TYPE=Release \
            -DCUBINGTIMER_TESTING=OFF \
            -DENABLE_TIDY=OFF \
            -DENABLE_SANITIZER_ADDRESS=OFF \
            -DENABLE_SANITIZER_UNDEFINED=OFF

      - name: Build
        run: cmake --build build/wasm --parallel

      - name: Stage wasm bundle for upload
        # Drop the four loader files into a dedicated dir so the downloaded
        # zip extracts as `CubingTimer-wasm/{html,js,wasm,qtloader.js}`. We
        # use our own index.html (under wasm/) — Qt's generated one shows a
        # blank page on mobile when GL init fails silently.
        run: |
          mkdir -p dist/CubingTimer-wasm
          cp wasm/index.html dist/CubingTimer-wasm/index.html
          cp build/wasm/src/CubingTimer/CubingTimerApp.js dist/CubingTimer-wasm/
          cp build/wasm/src/CubingTimer/CubingTimerApp.wasm dist/CubingTimer-wasm/
          cp build/wasm/src/CubingTimer/qtloader.js dist/CubingTimer-wasm/

      - name: Upload wasm artifact
        uses: actions/upload-artifact@v4
        with:
          name: CubingTimer-wasm
          path: dist/CubingTimer-wasm/
          if-no-files-found: error
          retention-days: 90
          compression-level: 9

  # -------------------------------------------------------------------------
  # Android APK: cross-compile, no tests on device.
  # -------------------------------------------------------------------------
  android:
    name: android (arm64-v8a)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Cache CPM packages
        uses: actions/cache@v4
        with:
          path: ${{ env.CPM_SOURCE_CACHE }}
          key: cpm-android-${{ hashFiles('CMakeLists.txt') }}
          restore-keys: cpm-android-

      - name: Install Ninja
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install host Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          modules: 'qtgraphs qtquick3d qtshadertools'
          cache: true
          set-env: false
          dir: ${{ github.workspace }}/qt-host

      - name: Install Qt for Android (arm64-v8a)
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          target: 'android'
          arch: 'android_arm64_v8a'
          modules: 'qtgraphs qtquick3d qtshadertools'
          cache: true
          set-env: false
          dir: ${{ github.workspace }}/qt-android

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0 ndk;26.1.10909125'

      - name: Remove newer pre-installed Android platforms
        # The runner image ships android-36-ext19 by default and Gradle picks
        # the highest available, which Qt 6.7.3's androiddeployqt + aapt2 can't
        # load. Removing them forces Gradle to fall back to android-34.
        run: |
          for p in $(ls $ANDROID_SDK_ROOT/platforms 2>/dev/null); do
            if [[ "$p" != "android-34" ]]; then
              rm -rf "$ANDROID_SDK_ROOT/platforms/$p"
              echo "removed platforms/$p"
            fi
          done

      - name: Configure
        env:
          ANDROID_NDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}/ndk/26.1.10909125
        run: |
          cmake -S . -B build/android -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE=${{ github.workspace }}/qt-android/Qt/${{ env.QT_VERSION }}/android_arm64_v8a/lib/cmake/Qt6/qt.toolchain.cmake \
            -DQT_HOST_PATH=${{ github.workspace }}/qt-host/Qt/${{ env.QT_VERSION }}/gcc_64 \
            -DANDROID_SDK_ROOT=$ANDROID_SDK_ROOT \
            -DANDROID_NDK_ROOT=$ANDROID_NDK_ROOT \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-34 \
            -DQT_ANDROID_API_VERSION=34 \
            -DQT_ANDROID_BUILD_ALL_ABIS=OFF \
            -DCMAKE_BUILD_TYPE=Release \
            -DCUBINGTIMER_TESTING=OFF \
            -DENABLE_TIDY=OFF \
            -DENABLE_SANITIZER_ADDRESS=OFF \
            -DENABLE_SANITIZER_UNDEFINED=OFF

      - name: Build APK
        run: cmake --build build/android --target apk

      - name: Stage APK with friendly name
        run: |
          mkdir -p dist
          apk=$(find build/android/src/CubingTimer/android-build/build/outputs/apk -name '*.apk' | head -1)
          if [ -z "$apk" ]; then
            echo "No APK found"; exit 1
          fi
          cp "$apk" dist/CubingTimer-arm64-v8a.apk
          ls -la dist/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CubingTimer-android-arm64-v8a
          path: dist/CubingTimer-arm64-v8a.apk
          if-no-files-found: error
          retention-days: 90
          compression-level: 9
